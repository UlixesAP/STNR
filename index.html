<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e17">
  <meta name="color-scheme" content="dark light">
  <script>
    (function () {
      var t = localStorage.getItem('sport_tournaments_theme');
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Спортивный менеджер турниров</title>
  <link rel="stylesheet" href="css/app.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
</head>
<body>
  <div id="app">
    <div class="app-shell">
      <p class="app-loading">Загрузка…</p>
    </div>
  </div>
  <script src="js/theme.js"></script>
  <script src="js/config.js"></script>
  <script src="js/system-icons.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/download-xlsx.js"></script>
  <script src="js/score-storage.js"></script>
  <script src="js/score-timer.js"></script>
  <script src="js/score-export.js"></script>
  <script src="js/scoreboard.js"></script>
  <script src="js/round-robin-schedules.js"></script>
  <script src="js/round-robin.js"></script>
  <script src="js/olympic.js"></script>
  <script src="js/app.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => Theme.init());</script>
</body>
</html>
