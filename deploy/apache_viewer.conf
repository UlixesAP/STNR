<VirtualHost *:80>
    ServerName _

    ProxyPreserveHost On
    ProxyRequests Off

    # Защищаем /viewer (статическая страница) и /events (SSE) базовой аутентификацией
    <Location "/viewer">
        AuthType Basic
        AuthName "Restricted Viewer"
        AuthUserFile /etc/apache2/.htpasswd
        Require valid-user

        ProxyPass http://127.0.0.1:3333/viewer
        ProxyPassReverse http://127.0.0.1:3333/viewer

        # Отключаем буферизацию для корректной работы SSE
        RequestHeader unset Connection
        SetEnv proxy-nokeepalive 1
    </Location>

    <Location "/events">
        AuthType Basic
        AuthName "Restricted Viewer"
        AuthUserFile /etc/apache2/.htpasswd
        Require valid-user

        ProxyPass http://127.0.0.1:3333/events
        ProxyPassReverse http://127.0.0.1:3333/events

        RequestHeader unset Connection
        SetEnv proxy-nokeepalive 1
    </Location>

    # Раздача сохранённых файлов (при желании можно защитить отдельно)
    ProxyPass /results/ http://127.0.0.1:3333/results/
    ProxyPassReverse /results/ http://127.0.0.1:3333/results/

    ErrorLog ${APACHE_LOG_DIR}/viewer_error.log
    CustomLog ${APACHE_LOG_DIR}/viewer_access.log combined
</VirtualHost>
