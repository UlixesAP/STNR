server {
    listen 80;
    listen [::]:80;
    server_name sportnr.ru www.sportnr.ru;

    client_max_body_size 20m;
    root /home/deploy/apps/turnirki/dist;
    index index.html;
    charset utf-8;

    # --- Защищённые эндпоинты Express ---
    location = /viewer {
        auth_basic "Restricted Viewer";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location = /events {
        auth_basic "Restricted Viewer";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # --- Остальные эндпоинты Express ---
    location = /publish { proxy_pass http://127.0.0.1:3333; }
    location = /save    { proxy_pass http://127.0.0.1:3333; }

    location /results/ {
        proxy_pass http://127.0.0.1:3333/results/;
    }

    # --- Хешированные ассеты: кэш на год ---
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Service Worker: не кэшировать никогда ---
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # --- Прочая статика: короткий кэш ---
    location ~* \.(css|js|webp|png|svg|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # --- SPA-fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}