server {
    listen 80;
    server_name _; # замените на ваш домен

    # Защитить страницу просмотра и поток событий базовой аутентификацией
    location /viewer {
        auth_basic "Restricted Viewer";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;

        proxy_pass http://127.0.0.1:3333;
    }

    # SSE поток тоже защищаем
    location /events {
        auth_basic "Restricted Viewer";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;

        proxy_pass http://127.0.0.1:3333/events;
    }

    # Раздача сохранённых файлов (при желании можно тоже защитить)
    location /results/ {
        proxy_pass http://127.0.0.1:3333/results/;
    }
}
